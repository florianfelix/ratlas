[package]
name = "ratlas"
version = "0.1.0"
edition = "2024"

[dependencies]
iced_winit = "0.14.1"
iced_wgpu = "0.14.0"
iced_runtime = "0.14.0"
iced = { version = "0.14.0", features = ["wgpu"] }
# wgpu = { version = "27.0.1", features = ["webgl"] }
winit = { version = "0.30", features = ["rwh_06"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
itertools = "0.15.0"
pollster = "1.0.1"
dyn-clone = "1.0.20"
enum-iterator = "2.3.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.8", features = ["preserve_order"] }
directories = "6.0.0"
glam = "0.34.1"
tobj = "4.0.5"
image = { version = "0.25.10", features = ["jpeg", "png"] }
tokio = { version = "1.53.3", features = ["full"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
reqwest = { version = "0.13.5", features = ["cookies", "blocking"] }
radiobrowser = "0.6.1"
rodio = "0.23.0"
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
isocountry = "0.3.2"
fuzzy-matcher = "0.3.7"


[profile.release]
opt-level = 3
